    <meta charset="UTF-8" />
    <script>
      (function () {
        // Element theme: saved choice wins, else follow the system.
        var s = null;
        try {
          s = localStorage.getItem("theme");
        } catch (e) {}
        var t =
          s === "light"
            ? "light"
            : s
              ? "dark"
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.colorScheme = t;
      })();
    </script>

    <style>
      .reader-wrapper {
        width: var(--container);
        margin: 0 auto;
        padding: 6rem 0 3rem;
      }
      .reader-controls {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: var(--r-l);
        padding: 1.25rem 1.5rem;
        margin-bottom: 1.5rem;
      }
      .control-row {
        display: flex;
        gap: 0.75rem 1rem;
        align-items: center;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }
      .control-row:last-child {
        margin-bottom: 0;
      }
      .control-label {
        font-weight: 600;
        min-width: 120px;
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      .book-select,
      .chapter-select {
        flex: 1;
        min-width: 200px;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--rule-strong);
        border-radius: var(--r-m);
        background: var(--surface);
        color: var(--ink);
        font: 400 1rem/1.4 var(--font-body);
        cursor: pointer;
      }
      .book-select:disabled,
      .chapter-select:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .book-select:focus,
      .chapter-select:focus,
      .setting-btn:focus-visible,
      .pagination-btn:focus-visible {
        outline: 2px solid var(--nitrogen);
        outline-offset: 2px;
      }
      .reader-settings {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .setting-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .setting-btn {
        min-width: 40px;
        min-height: 40px;
        padding: 0.4rem 0.75rem;
        border: 1px solid var(--rule-strong);
        background: var(--surface);
        color: var(--ink);
        border-radius: var(--r-m);
        cursor: pointer;
        font: 600 1rem/1 var(--font-body);
        transition: border-color 0.15s ease;
      }
      .setting-btn:hover {
        border-color: var(--ink);
      }
      .font-size-display {
        min-width: 56px;
        text-align: center;
        font-weight: 600;
        color: var(--graphite);
      }
      .reader-content {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: var(--r-l);
        padding: 3.5rem clamp(1.25rem, 5vw, 4.5rem);
        min-height: 600px;
        font-family: var(--font-body);
        font-size: var(--font-size, 18px);
        line-height: 1.65;
        color: var(--ink);
      }
      .reader-content > * {
        max-width: 68ch;
      }
      .reader-content h1,
      .reader-content h2,
      .reader-content h3 {
        font-family: var(--font-display);
        font-stretch: 68%;
        font-weight: 760;
        line-height: 1.1;
        letter-spacing: -0.01em;
        color: var(--ink);
        margin: 1.8em 0 0.6em;
      }
      .reader-content h1 {
        font-size: 2.125rem;
      }
      .reader-content h2 {
        font-size: 1.625rem;
      }
      .reader-content h3 {
        font-size: 1.3125rem;
      }
      .reader-content p {
        margin-bottom: 1.2em;
      }
      .reader-content a {
        color: var(--nitrogen);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.18em;
      }
      .reader-content code {
        background: var(--surface-2);
        padding: 0.1em 0.35em;
        border-radius: var(--r-s);
        font-family: var(--font-mono);
        font-size: 0.875em;
      }
      .reader-content pre {
        background: var(--surface-2);
        border: 1px solid var(--rule);
        border-radius: var(--r-m);
        padding: 1rem 1.25rem;
        overflow-x: auto;
        margin: 1.4em 0;
        font-size: 14px;
        line-height: 1.55;
      }
      .reader-content pre code {
        background: none;
        padding: 0;
        font-size: inherit;
      }
      .reader-content blockquote {
        border-left: 2px solid var(--rule);
        padding-left: 1.25rem;
        margin: 1.4em 0;
        color: var(--graphite);
      }
      .reader-content hr {
        border: none;
        border-top: 1px solid var(--rule);
        margin: 2em 0;
      }
      .chapter-header {
        margin-bottom: 2.5rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--rule);
      }
      .chapter-book {
        color: var(--graphite);
        font-size: 0.9375rem;
        margin-bottom: 0.75rem;
      }
      .chapter-title-main {
        font-size: 2.75rem;
        margin: 0 0 0.5rem;
      }
      .chapter-subtitle {
        font-size: 1.3125rem;
        font-weight: 500;
        font-stretch: 100%;
        font-family: var(--font-body);
        color: var(--graphite);
        margin: 0;
      }
      .reader-status {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--graphite);
      }
      .reader-status-error {
        color: var(--oxygen);
      }
      .empty-state {
        text-align: center;
        padding: 4rem 1rem;
        color: var(--graphite);
      }
      .empty-state h2 {
        font-family: var(--font-display);
        font-stretch: 68%;
        font-size: 1.625rem;
        color: var(--ink);
        margin: 0.75rem 0 0.5rem;
      }
      .empty-state i {
        opacity: 0.5;
      }
      .pagination {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 2.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--rule);
      }
      .pagination-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 40px;
        padding: 0.5rem 1rem;
        background: var(--nitrogen);
        color: var(--on-nitrogen);
        border: 1px solid var(--nitrogen);
        border-radius: var(--r-m);
        cursor: pointer;
        font: 600 0.9375rem/1.2 var(--font-body);
        transition: background 0.15s ease;
      }
      .pagination-btn:hover:not(:disabled) {
        background: var(--nitrogen-hover);
        border-color: var(--nitrogen-hover);
      }
      .pagination-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      @media (max-width: 768px) {
        .reader-wrapper {
          padding: 5.5rem 0 1.5rem;
        }
        .reader-content {
          padding: 2rem 1.25rem;
        }
        .control-row {
          flex-direction: column;
          align-items: stretch;
        }
        .control-label {
          min-width: auto;
        }
        .reader-settings {
          justify-content: center;
        }
      }
      @media print {
        .reader-controls,
        .pagination,
        #navbar-container {
          display: none !important;
        }
        .reader-content {
          border: none;
          padding: 0;
        }
      }
    </style>
    <link rel="stylesheet" href="../assets/css/element.css" />

  <body>
    <div id="navbar-container"></div>
    <script type="module" src="../assets/js/navbar.js"></script>

    <div class="reader-wrapper">
      <div class="reader-controls">
        <div class="control-row">
          <span class="control-label">
            <i data-lucide="book-open" class="inline w-5 h-5"></i> Book
          </span>
          <select class="book-select" id="book-select">
            <option value="">Select a book</option>
            <option value="sample">Sample book</option>
          </select>
        </div>

        <div class="control-row">
          <span class="control-label">
            <i data-lucide="bookmark" class="inline w-5 h-5"></i> Chapter
          </span>
          <select class="chapter-select" id="chapter-select" disabled>
            <option value="">Select a chapter</option>
          </select>
        </div>

        <div class="control-row">
          <span class="control-label">
            <i data-lucide="settings" class="inline w-5 h-5"></i> Settings
          </span>
          <div class="reader-settings">
            <div class="setting-group">
              <button
                class="setting-btn"
                onclick="changeFontSize(-2)"
                title="Decrease font size"
              >
                A-
              </button>
              <span class="font-size-display" id="font-size-display">18px</span>
              <button
                class="setting-btn"
                onclick="changeFontSize(2)"
                title="Increase font size"
              >
                A+
              </button>
            </div>
            <button
              class="setting-btn"
              onclick="toggleTheme()"
              title="Toggle theme"
            >
              <i data-lucide="sun"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="reader-content" id="reader-content">
        <div class="empty-state">
          <div>
            <i
              data-lucide="book-open"
              class="w-16 h-16 mx-auto mb-4 opacity-30"
            ></i>
          </div>
          <h2>Welcome to E-Reader</h2>
          <p>Select a book from the dropdown above to start reading.</p>
        </div>
      </div>
    </div>

    <script type="module" src="../assets/js/reader.js"></script>
    <script>
      // Initialize Lucide icons (wait for deferred CDN script to load)
      if (typeof lucide !== "undefined") {
        lucide.createIcons();
      } else {
        window.addEventListener("load", () => {
          if (typeof lucide !== "undefined") lucide.createIcons();
        });
      }

      let currentFontSize = 18;
      let currentBook = null;

      function changeFontSize(delta) {
        currentFontSize = Math.max(14, Math.min(28, currentFontSize + delta));
        document
          .getElementById("reader-content")
          .style.setProperty("--font-size", currentFontSize + "px");
        document.getElementById("font-size-display").textContent =
          currentFontSize + "px";
      }

      function toggleTheme() {
        const root = document.documentElement;
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        document.body.setAttribute("data-theme", next);
        root.style.colorScheme = next;
        try {
          localStorage.setItem("theme", next);
        } catch (e) {}
      }

      // Initialize
      document
        .getElementById("book-select")
        .addEventListener("change", function () {
          const bookId = this.value;
          if (bookId === "sample") {
            // Load sample content
            const content = `
# Sample Chapter

This is a sample book to demonstrate the E-Reader functionality.

## Introduction

The E-Reader shows chapters as formatted text with:

- Clean, book-like typography
- Adjustable font sizes
- Dark/light theme toggle
- Markdown support with math rendering

## Features

You can write **bold text**, *italic text*, and even \`inline code\`.

### Code Blocks

\`\`\`python
def hello_world():
    print("Hello from E-Reader!")
\`\`\`

### Mathematics

KaTeX renders equations such as:
$$E = mc^2$$

> "The best way to predict the future is to invent it." - Alan Kay

Enjoy reading!
                `;

            document.getElementById("reader-content").innerHTML =
              marked.parse(content);
            document.getElementById("chapter-select").disabled = false;
          }
        });
    </script>
  </body>
</html>
