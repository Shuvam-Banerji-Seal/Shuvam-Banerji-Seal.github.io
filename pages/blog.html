<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        // Element theme: saved choice wins, else follow the system.
        var s = null;
        try {
          s = localStorage.getItem("theme");
        } catch (e) {}
        var t =
          s === "light"
            ? "light"
            : s
              ? "dark"
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Blog by Shuvam Banerji Seal - Computational Chemistry, AI, Programming, and research notes."
    />
    <link rel="canonical" href="https://shuvam-banerji-seal.github.io/pages/blog.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Blog - Shuvam Banerji Seal" />
    <meta property="og:description" content="Technical blog posts on computational chemistry, AI, and software engineering." />
    <meta property="og:url" content="https://shuvam-banerji-seal.github.io/pages/blog.html" />
    <meta property="og:image" content="https://shuvam-banerji-seal.github.io/assets/img/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://shuvam-banerji-seal.github.io/assets/img/og-image.svg" />
    <meta name="twitter:title" content="Blog - Shuvam Banerji Seal" />
    <meta name="twitter:description" content="Technical blog posts on computational chemistry, AI, and software engineering." />
    <meta name="robots" content="index, follow" />
    <title>Blog - Shuvam Banerji Seal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"

    <link rel="stylesheet" href="../assets/css/theme.css" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/mobile-fixes.css" />
    <link rel="stylesheet" href="../assets/css/mobile.css" />

      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script defer src="https://cdn.jsdelivr.net/npm/lucide@1.33.0/dist/umd/lucide.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 1rem;
        line-height: 1.6;
        overflow-x: hidden;
      }
      main {
        width: var(--container);
        margin: 0 auto;
        padding: 6rem 0 4rem;
      }
      .blog-header {
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--rule);
      }
      .blog-page-title {
        font-family: var(--font-display);
        font-stretch: 68%;
        font-weight: 800;
        font-size: clamp(2.125rem, 5vw, 2.75rem);
        line-height: 1;
        letter-spacing: -0.01em;
        color: var(--ink);
        margin-bottom: 0.75rem;
      }
      .blog-page-sub {
        color: var(--graphite);
        font-size: 1.0625rem;
        max-width: 60ch;
        margin-bottom: 1rem;
      }
      .blog-stats {
        display: flex;
        gap: 0.5rem 1.5rem;
        flex-wrap: wrap;
        color: var(--graphite);
        font-size: 0.9375rem;
      }
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1rem;
        align-items: center;
        padding: 1.25rem 0;
        border-bottom: 1px solid var(--rule);
      }
      .filter-label {
        color: var(--graphite);
        font-size: 0.875rem;
        font-weight: 500;
        white-space: nowrap;
      }
      .search-box {
        flex: 1;
        min-width: 180px;
        padding: 0.5rem 0.75rem;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--rule-strong);
        border-radius: var(--r-m);
        font: 400 0.9375rem/1.3 var(--font-body);
        outline: none;
      }
      .search-box:focus {
        outline: 2px solid var(--nitrogen);
        outline-offset: 1px;
      }
      .tag-filter-btn {
        padding: 0.25rem 0.6rem;
        border-radius: var(--r-s);
        border: 1px solid var(--rule);
        background: transparent;
        color: var(--graphite);
        font: 500 0.8125rem/1.5 var(--font-body);
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
        white-space: nowrap;
      }
      .tag-filter-btn:hover {
        border-color: var(--ink);
        color: var(--ink);
      }
      .tag-filter-btn.active {
        background: var(--nitrogen-wash);
        border-color: var(--nitrogen);
        color: var(--ink);
      }
      /* Post list: rows separated by hairlines, not cards */
      .blog-grid {
        display: flex;
        flex-direction: column;
      }
      .blog-card {
        display: flex;
        flex-direction: column;
        padding: 1.5rem 0;
        border-bottom: 1px solid var(--rule);
      }
      .blog-card:first-child {
        border-top: 1px solid var(--rule);
      }
      .card-body {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .card-tags,
      .post-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
      }
      .card-tag,
      .post-tag {
        padding: 0.1rem 0.45rem;
        border: 1px solid var(--rule);
        border-radius: var(--r-s);
        color: var(--graphite);
        font: 500 0.8125rem/1.5 var(--font-body);
      }
      .card-title {
        font-family: var(--font-display);
        font-stretch: 68%;
        font-weight: 720;
        font-size: 1.3125rem;
        line-height: 1.2;
        color: var(--ink);
        text-decoration: none;
      }
      .card-title:hover {
        color: var(--nitrogen);
      }
      .card-excerpt {
        color: var(--graphite);
        font-size: 0.9375rem;
        line-height: 1.55;
        max-width: 68ch;
      }
      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 0.25rem;
        color: var(--graphite);
        font-size: 0.875rem;
      }
      .card-read {
        color: var(--nitrogen);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.18em;
      }
      .card-read:hover {
        text-decoration-thickness: 2px;
      }
      .blog-loading,
      .blog-empty {
        padding: 4rem 0;
        color: var(--graphite);
        font-size: 1rem;
      }
      .blog-error-detail {
        font-size: 0.875rem;
      }
      /* Single post */
      .post-back-link {
        display: inline-block;
        margin-bottom: 2rem;
        color: var(--nitrogen);
        font-size: 0.9375rem;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.18em;
      }
      .post-back-link:hover {
        text-decoration-thickness: 2px;
      }
      .post-container {
        max-width: 68ch;
      }
      .post-header {
        padding-bottom: 1.5rem;
        margin-bottom: 2rem;
        border-bottom: 1px solid var(--rule);
      }
      .post-tags {
        margin-bottom: 1rem;
      }
      .post-title {
        font-family: var(--font-display);
        font-stretch: 68%;
        font-weight: 800;
        font-size: 2.75rem;
        line-height: 1.04;
        letter-spacing: -0.01em;
        color: var(--ink);
        margin-bottom: 0.75rem;
        text-wrap: balance;
      }
      @media (max-width: 600px) {
        .post-title {
          font-size: 2.125rem;
        }
      }
      .post-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.25rem;
        color: var(--graphite);
        font-size: 0.9375rem;
      }
      /* Long-form reading */
      .prose {
        font-family: var(--font-body);
        font-size: 18px;
        line-height: 1.65;
        color: var(--ink);
        max-width: 68ch;
      }
      .prose p {
        margin-bottom: 1.2em;
      }
      .prose h1,
      .prose h2,
      .prose h3 {
        font-family: var(--font-display);
        font-stretch: 68%;
        font-weight: 760;
        line-height: 1.1;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .prose h1 {
        font-size: 34px;
        margin: 2em 0 0.6em;
      }
      .prose h2 {
        font-size: 26px;
        margin: 1.8em 0 0.6em;
      }
      .prose h3 {
        font-size: 21px;
        margin: 1.5em 0 0.5em;
      }
      .prose a {
        color: var(--nitrogen);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.18em;
      }
      .prose a:hover {
        text-decoration-thickness: 2px;
      }
      .prose strong {
        font-weight: 650;
      }
      .prose ul,
      .prose ol {
        margin: 0 0 1.2em 1.5em;
      }
      .prose li {
        margin-bottom: 0.35em;
      }
      .prose code {
        font-family: var(--font-mono);
        font-size: 0.875em;
        background: var(--surface-2);
        padding: 0.1em 0.35em;
        border-radius: var(--r-s);
      }
      .prose pre {
        font-family: var(--font-mono);
        font-size: 14px;
        line-height: 1.55;
        background: var(--surface-2);
        border: 1px solid var(--rule);
        border-radius: var(--r-m);
        padding: 1rem 1.25rem;
        overflow-x: auto;
        margin: 0 0 1.4em;
      }
      .prose pre code {
        background: none;
        padding: 0;
        font-size: inherit;
        border-radius: 0;
      }
      .prose pre code.hljs {
        background: transparent;
        padding: 0;
        color: var(--ink);
      }
      /* Token colours on the dark surface (light tokens come from github.min.css) */
      :root[data-theme="dark"] .prose pre code.hljs .hljs-keyword,
      :root[data-theme="dark"] .prose pre code.hljs .hljs-selector-tag,
      :root[data-theme="dark"] .prose pre code.hljs .hljs-built_in,
      :root[data-theme="dark"] .prose pre code.hljs .hljs-literal {
        color: #ff7b72;
      }
      :root[data-theme="dark"] .prose pre code.hljs .hljs-string {
        color: #a5d6ff;
      }
      :root[data-theme="dark"] .prose pre code.hljs .hljs-comment {
        color: #8b949e;
      }
      :root[data-theme="dark"] .prose pre code.hljs .hljs-number {
        color: #79c0ff;
      }
      :root[data-theme="dark"] .prose pre code.hljs .hljs-title,
      :root[data-theme="dark"] .prose pre code.hljs .hljs-function {
        color: #d2a8ff;
      }
      :root[data-theme="dark"] .prose pre code.hljs .hljs-type,
      :root[data-theme="dark"] .prose pre code.hljs .hljs-class {
        color: #ffa657;
      }
      .prose blockquote {
        border-left: 2px solid var(--rule);
        margin: 0 0 1.4em;
        padding-left: 1.25rem;
        color: var(--graphite);
      }
      .prose img {
        max-width: 100%;
        height: auto;
        border-radius: var(--r-m);
        border: 1px solid var(--rule);
        margin: 1.5em 0;
      }
      .prose hr {
        border: none;
        border-top: 1px solid var(--rule);
        margin: 2.5em 0;
      }
      .prose table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5em 0;
        font-size: 0.875rem;
      }
      .prose th,
      .prose td {
        border-bottom: 1px solid var(--rule);
        padding: 0.5rem 0.75rem;
        text-align: left;
        vertical-align: top;
      }
      .prose th {
        font-weight: 600;
      }
      footer {
        border-top: 1px solid var(--rule);
        padding: 3rem var(--gutter);
        text-align: center;
        color: var(--graphite);
        font-size: 0.9375rem;
      }
      .footer-social {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .social-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: var(--r-m);
        border: 1px solid var(--rule);
        color: var(--ink);
        text-decoration: none;
        transition: border-color 0.15s ease;
      }
      .social-link:hover {
        border-color: var(--ink);
      }
      @media (max-width: 640px) {
        .filter-bar {
          flex-direction: column;
          align-items: stretch;
        }
        .blog-stats {
          gap: 0.5rem 1rem;
        }
      }
    </style>
    <link rel="stylesheet" href="../assets/css/element.css" />
  </head>
  <body>
    <div id="navbar-container"></div>
    <script type="module" src="../assets/js/navbar.js"></script>
    <main>
      <header class="blog-header">
        <h1 class="blog-page-title">Blog</h1>
        <p class="blog-page-sub">
          Research notes, technical write-ups, and thoughts on computational
          chemistry &amp; AI.
        </p>
        <div class="blog-stats">
          <span id="stat-count">Loading&#x2026;</span>
          <span>Topics: Chemistry, AI, Programming</span>
        </div>
      </header>
      <div class="filter-bar" id="filter-bar" style="display: none">
        <label class="filter-label" for="search-input">Search</label>
        <input
          type="text"
          class="search-box"
          id="search-input"
          placeholder="Search posts&#x2026;"
          aria-label="Search blog posts"
          autocomplete="off"
        />
        <span class="filter-label">Tags</span>
        <div
          id="tag-filters"
          style="display: flex; flex-wrap: wrap; gap: 0.5rem"
        ></div>
      </div>
      <div id="blog-content">
        <div class="blog-loading">Loading posts&#x2026;</div>
      </div>
    </main>
    <footer>
      <div class="footer-social">
        <a
          href="https://github.com/Shuvam-Banerji-Seal"
          target="_blank"
          class="social-link"
          aria-label="GitHub"
        >
          <i data-lucide="code-2" class="social-icon"></i>
        </a>
        <a
          href="https://linkedin.com/in/mastersbs"
          target="_blank"
          class="social-link"
          aria-label="LinkedIn"
        >
          <i data-lucide="briefcase" class="social-icon"></i>
        </a>
        <a
          href="https://orcid.org/0009-0000-0714-569X"
          target="_blank"
          class="social-link"
          aria-label="ORCID"
        >
          <i data-lucide="award" class="social-icon"></i>
        </a>
        <a
          href="mailto:sbs22ms076@iiserkol.ac.in"
          class="social-link"
          aria-label="Email"
        >
          <i data-lucide="mail" class="social-icon"></i>
        </a>
      </div>
      <p>
        &copy; <span id="year"></span> Shuvam Banerji Seal
      </p>
    </footer>
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="../assets/js/blog-loader.js"></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
      if (typeof lucide !== "undefined") lucide.createIcons();
    </script>
  </body>
</html>
